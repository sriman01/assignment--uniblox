<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#102858" />
    <title>Assignment · Sleep &amp; Home Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Inline so the first paint is the light store background, not a blank (or dark-mode black) page. -->
    <style>
      html, body { margin: 0; background: #fafafa; color-scheme: light; }
      .app-splash {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        animation: app-splash-in 300ms cubic-bezier(0.23, 1, 0.32, 1) 150ms both;
      }
      .app-splash--mounted { animation: none; }
      .app-splash__mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 0 12px 0 12px;
        background: #102858;
        color: #fff;
        font: 800 32px/1 "Figtree", "Segoe UI", system-ui, sans-serif;
        box-shadow: inset -6px -6px 0 rgba(7, 170, 142, 0.9);
      }
      .app-splash__bar { position: relative; width: 120px; height: 3px; border-radius: 3px; background: #e3e7ee; overflow: hidden; }
      .app-splash__bar span {
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #07aa8e;
        animation: app-splash-bar 1.1s cubic-bezier(0.77, 0, 0.175, 1) infinite;
      }
      @keyframes app-splash-in { from { opacity: 0; transform: translateY(4px); } }
      @keyframes app-splash-fade { from { opacity: 0; } }
      @keyframes app-splash-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .app-splash:not(.app-splash--mounted) { animation-name: app-splash-fade; }
        .app-splash__bar span { animation: none; width: 100%; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash" role="status" aria-label="Loading the store">
        <span class="app-splash__mark">A</span>
        <span class="app-splash__bar"><span></span></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
